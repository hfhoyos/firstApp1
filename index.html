<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Ayuda IA</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* ==================== DESIGN SYSTEM ==================== */
        :root {
            --bg-base:       #f1f1f3;
            --bg-gradient:   linear-gradient(135deg, #e5e7eb 0%, #d1d5db 100%);
            --surface:       rgba(255,255,255,0.92);
            --surface-2:     rgba(255,255,255,0.75);
            --accent:        #3b82f6;
            --accent-dark:   #2563eb;
            --accent-light:  #93c5fd;
            --success:       #10b981;
            --warning:       #f59e0b;
            --error:         #ef4444;
            --text:          #1f2937;
            --text-secondary: #64748b;
            --text-muted:    #9ca3af;
            --radius-sm:     12px;
            --radius-md:     20px;
            --radius-lg:     28px;
            --shadow:        0 10px 30px -10px rgb(0 0 0 / 0.15);
            --shadow-sm:     0 4px 12px rgba(0,0,0,0.06);
            --font-display:  'DM Serif Display', serif;
            --font-mono:     'DM Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "DM Mono", monospace;
            background: var(--bg-gradient);
            min-height: 100vh;
            color: var(--text);
            display: flex;
            flex-direction: column;
            transition: background-color 200ms ease;
        }

        /* ==================== COMPONENTES ==================== */
        .glass {
            background: var(--surface);
            backdrop-filter: blur(24px);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: var(--radius-lg);
        }

        .glass-sm {
            background: var(--surface);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: var(--radius-md);
        }

        /* ==================== HEADER ==================== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.5rem;
            background: var(--surface);
            border-bottom: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(24px);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo {
            width: 2.5rem;
            height: 2.5rem;
            background: linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            flex-shrink: 0;
        }

        .header-text h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--text);
        }

        .header-text p {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: -0.25rem;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: rgba(255,255,255,0.8);
            border-radius: var(--radius-lg);
            padding: 0.625rem 1.25rem;
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .api-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .api-key-icon {
            width: 1.25rem;
            height: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(245, 158, 11, 0.1);
            border-radius: 50%;
            color: #f59e0b;
            font-weight: bold;
        }

        #apiKeyInput {
            background: transparent;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-md);
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-family: var(--font-mono);
            width: 20rem;
            color: var(--text);
            transition: border-color 200ms ease;
        }

        #apiKeyInput:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        #apiKeyInput::placeholder {
            color: #cbd5e1;
        }

        #apiKeyInput:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #connectBtn {
            background: var(--success);
            color: white;
            border: none;
            padding: 0.625rem 1.5rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 200ms ease, transform 200ms ease;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.2);
        }

        #connectBtn:hover:not(:disabled) {
            background: #059669;
            transform: translateY(-1px);
        }

        #connectBtn:disabled {
            opacity: 0.8;
            cursor: not-allowed;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            background: rgba(255,255,255,0.8);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255,255,255,0.7);
        }

        .status-dot {
            width: 0.5rem;
            height: 0.5rem;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #status {
            color: var(--success);
            font-weight: 500;
        }

        .user-avatar {
            width: 2.25rem;
            height: 2.25rem;
            background: rgba(255,255,255,0.8);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            cursor: pointer;
            transition: transform 200ms ease;
        }

        .user-avatar:hover {
            transform: scale(1.1);
        }

        /* ==================== MAIN CONTENT ==================== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            max-width: 80rem;
            margin: 0 auto;
            width: 100%;
        }

        #chatWindow {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            padding: 2rem;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        #chatWindow::-webkit-scrollbar {
            width: 8px;
        }

        #chatWindow::-webkit-scrollbar-track {
            background: transparent;
        }

        #chatWindow::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .message-group {
            display: flex;
            gap: 1.25rem;
            max-width: 32rem;
            animation: fadeInUp 300ms ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(1rem);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-group.user {
            justify-content: flex-end;
            max-width: none;
        }

        .message-group.user .message-bubble {
            max-width: 32rem;
        }

        .message-avatar {
            width: 2.5rem;
            height: 2.5rem;
            background: linear-gradient(135deg, #3b82f6 0%, #4f46e5 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.2);
            flex-shrink: 0;
        }

        .message-content {
            flex: 1;
        }

        .message-timestamp {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .message-group.user .message-timestamp {
            text-align: right;
        }

        .message-bubble {
            padding: 1rem 1.25rem;
            border-radius: 1.375rem;
            box-shadow: var(--shadow-sm);
            word-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .message-bubble.user {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 0.375rem;
        }

        .message-bubble.assistant {
            background: rgba(255,255,255,0.75);
            color: var(--text);
            border-bottom-left-radius: 0.375rem;
        }

        .typing-indicator {
            display: none;
            gap: 1.25rem;
            max-width: 32rem;
            animation: fadeInUp 300ms ease;
        }

        .typing-indicator.visible {
            display: flex;
        }

        .typing-dots {
            display: flex;
            gap: 0.25rem;
            padding: 1rem 1.25rem;
            background: rgba(255,255,255,0.75);
            border-radius: 1.375rem;
            border-bottom-left-radius: 0.375rem;
            box-shadow: var(--shadow-sm);
        }

        .typing-dot {
            width: 0.5rem;
            height: 0.5rem;
            background: #9ca3af;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-dot:nth-child(1) { animation-delay: 0ms; }
        .typing-dot:nth-child(2) { animation-delay: 200ms; }
        .typing-dot:nth-child(3) { animation-delay: 400ms; }

        @keyframes bounce {
            0%, 80%, 100% { opacity: 0.4; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-0.5rem); }
        }

        /* ==================== FOOTER ==================== */
        footer {
            background: var(--surface);
            border-top: 1px solid rgba(255,255,255,0.6);
            backdrop-filter: blur(24px);
            padding: 1.5rem;
            margin-top: auto;
        }

        .footer-container {
            max-width: 80rem;
            margin: 0 auto;
        }

        .input-wrapper {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            background: rgba(255,255,255,0.8);
            border-radius: var(--radius-lg);
            padding: 1rem;
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        #messageInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-size: 0.875rem;
            color: var(--text);
            font-family: var(--font-mono);
            padding: 0.75rem 1.5rem;
            resize: none;
            max-height: 13rem;
            line-height: 1.5;
        }

        #messageInput::placeholder {
            color: #cbd5e1;
        }

        #messageInput:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #sendBtn {
            width: 3.5rem;
            height: 3.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 200ms ease, transform 200ms ease, box-shadow 200ms ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        #sendBtn:hover:not(:disabled) {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer-caption {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1.25rem;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }

            .header-center {
                width: 100%;
                flex-direction: column;
            }

            #apiKeyInput {
                width: 100%;
            }

            main {
                padding: 1rem;
            }

            #chatWindow {
                padding: 1.5rem;
                gap: 1.5rem;
            }

            .message-group {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- ==================== HEADER ==================== -->
    <header>
        <div class="header-brand">
            <div class="logo">🤖</div>
            <div class="header-text">
                <h1>Mesa de Ayuda IA</h1>
                <p>Soporte inteligente • Siempre disponible</p>
            </div>
        </div>

        <div class="header-center">
            <div class="api-label">
                <div class="api-key-icon">🔑</div>
                <span>API Key:</span>
            </div>
            <input 
                type="password" 
                id="apiKeyInput"
                placeholder="sk-••••••••••••••••"
            >
            <button id="connectBtn" onclick="connectAPI()">
                <span>⚡</span>
                <span>Conectar</span>
            </button>
        </div>

        <div class="header-right">
            <div class="status-badge">
                <div class="status-dot"></div>
                <span id="status">Desconectado</span>
            </div>
            <div class="user-avatar">👤</div>
        </div>
    </header>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main>
        <div id="chatWindow" class="glass">
            <!-- Mensaje de bienvenida -->
            <div class="message-group">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="message-timestamp">Asistente IA • Ahora</div>
                    <div class="message-bubble assistant">
                        ¡Hola! Soy tu asistente de Mesa de Ayuda.<br>
                        ¿En qué puedo ayudarte hoy?
                    </div>
                </div>
            </div>
        </div>

        <!-- Typing indicator -->
        <div id="typingIndicator" class="typing-indicator">
            <div class="message-avatar">🤖</div>
            <div class="message-content">
                <div class="message-timestamp">Asistente IA • Escribiendo...</div>
                <div class="message-bubble assistant">
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer>
        <div class="footer-container">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput"
                    rows="1"
                    placeholder="Escribe tu consulta aquí... (Shift + Enter para nueva línea)"
                    onkeydown="handleKey(event)"
                    oninput="autoResize(this)"
                ></textarea>
                <button id="sendBtn" onclick="sendMessage()">📤</button>
            </div>
            <div class="footer-caption">
                Mockup de demostración • Diseño vanilla puro
            </div>
        </div>
    </footer>

    <script>
        // ==================== MÓDULO 1 → ESTADO ====================
        let apiKey = '';
        let conversationHistory = [];
        let knowledgeBase = '';

        // ==================== MÓDULO 2 → RAG ====================
        async function loadKnowledgeBase() {
            try {
                const response = await fetch('./catalogo1.txt');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                knowledgeBase = await response.text();
                
                console.log(`%c✅ Catálogo cargado correctamente (${(knowledgeBase.length / 1024).toFixed(1)} KB)`, 
                    "color:#10b981; font-weight:bold");
                
                buildSystemPrompt();
                
            } catch (error) {
                console.error("Error cargando catálogo:", error);
                knowledgeBase = "No se pudo cargar el catálogo.";
                
                addMessage('assistant', 
                    "⚠️ No se pudo cargar el archivo catalogo1.txt. El asistente funcionará sin base de conocimiento específica.");
            }
        }

        // ==================== MÓDULO 3 → SYSTEM PROMPT ====================
        let SYSTEM_PROMPT = "";
        
        function buildSystemPrompt() {
            SYSTEM_PROMPT = `Eres el asistente de soporte técnico de una empresa.

REGLAS CRÍTICAS:
1. Responde ÚNICAMENTE usando la información del catálogo proporcionado.
2. Si la información no está en el catálogo, di: "Esa información no está disponible en mi base de conocimiento. Te recomiendo contactar directamente con soporte."
3. Tono: profesional y conciso.
4. Nunca inventes datos que no estén en el catálogo.

BASE DE CONOCIMIENTO:
${knowledgeBase}`;
        }

        // ==================== MÓDULO 4 → API KEY ====================
        function saveApiKey() {
            const input = document.getElementById('apiKeyInput');
            const key = input.value.trim();
            
            if (!key) {
                alert("Por favor ingresa una API Key");
                return false;
            }
            
            if (!key.startsWith('sk-')) {
                alert("La API Key debe comenzar con 'sk-'");
                return false;
            }
            
            apiKey = key;
            return true;
        }
        
        function connectAPI() {
            if (saveApiKey()) {
                const input = document.getElementById('apiKeyInput');
                const btn = document.getElementById('connectBtn');
                
                input.disabled = true;
                
                btn.innerHTML = '<span>✓</span><span>Conectado</span>';
                btn.disabled = true;
                btn.style.opacity = '0.8';
                btn.style.cursor = 'default';
                
                document.getElementById('status').textContent = 'Conectado';
                
                console.log("%c✅ API Key conectada correctamente", "color:#10b981; font-weight:bold");
            }
        }

        // ==================== MÓDULO 5 → ENVIAR MENSAJE ====================
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;
            if (!apiKey) {
                alert("Por favor conecta tu API Key primero");
                return;
            }
            
            addMessage('user', text);
            conversationHistory.push({ role: 'user', content: text });
            
            input.value = '';
            autoResize(input);
            showTyping(true);
            
            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        temperature: 0.3,
                        max_tokens: 600,
                        messages: [
                            { role: 'system', content: SYSTEM_PROMPT },
                            ...conversationHistory
                        ]
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                const assistantMessage = data.choices[0].message.content;
                
                conversationHistory.push({ role: 'assistant', content: assistantMessage });
                
                showTyping(false);
                addMessage('assistant', assistantMessage);
                
                // Guardar PQRS automáticamente
                await savePQRS(text, assistantMessage);
                
            } catch (error) {
                showTyping(false);
                console.error(error);
                addMessage('assistant', `❌ Error de conexión: ${error.message}. Verifica tu API Key y conexión a internet.`);
            }
        }

        // ==================== MÓDULO 5B → GUARDAR PQRS EN SUPABASE ====================
        // CONFIGURACIÓN: reemplaza con tus credenciales de Supabase
        const SUPABASE_URL = 'https://XXXXX.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...';

        async function savePQRS(userMessage, aiResponse) {
            if (!SUPABASE_URL || SUPABASE_URL.includes('XXXXX')) {
                console.log('⚠️ Supabase no configurado — PQRS no se guardará');
                return;
            }

            try {
                const tipoMap = {
                    'pregunt': 'Pregunta',
                    'quej': 'Queja',
                    'reclam': 'Reclamo',
                    'sugerenm': 'Sugerencia',
                    'problem': 'Problema'
                };
                
                let tipo = 'Consulta General';
                for (const [palabra, tipoNombre] of Object.entries(tipoMap)) {
                    if (userMessage.toLowerCase().includes(palabra)) {
                        tipo = tipoNombre;
                        break;
                    }
                }

                const timestamp = new Date().toISOString();

                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/pqrs`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        },
                        body: JSON.stringify({
                            timestamp: timestamp,
                            nombre: 'Usuario Anónimo',
                            email: 'soporte@empresa.com',
                            tipo: tipo,
                            consulta: userMessage.substring(0, 500),
                            respuesta: aiResponse.substring(0, 1000)
                        })
                    }
                );

                if (response.ok) {
                    console.log('%c✅ PQRS guardada en Supabase', 'color:#10b981; font-weight:bold');
                } else {
                    console.warn('⚠️ Error Supabase:', response.status);
                }

            } catch (error) {
                console.error('Error guardando PQRS:', error);
            }
        }

        // ==================== MÓDULO 6 → UI HELPERS ====================
        function addMessage(role, content) {
            const chatWindow = document.getElementById('chatWindow');
            const isUser = role === 'user';
            
            const messageGroup = document.createElement('div');
            messageGroup.className = `message-group ${isUser ? 'user' : ''}`;
            
            const html = `
                ${!isUser ? `<div class="message-avatar">🤖</div>` : ''}
                <div class="message-content">
                    <div class="message-timestamp">${isUser ? 'Tú' : 'Asistente IA'} • Ahora</div>
                    <div class="message-bubble ${isUser ? 'user' : 'assistant'}">
                        ${escapeHtml(content)}
                    </div>
                </div>
            `;
            
            messageGroup.innerHTML = html;
            chatWindow.insertAdjacentElement('beforeend', messageGroup);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
        
        function showTyping(visible) {
            const indicator = document.getElementById('typingIndicator');
            const chatWindow = document.getElementById('chatWindow');
            
            if (visible) {
                indicator.classList.add('visible');
                chatWindow.insertAdjacentElement('beforeend', indicator);
            } else {
                indicator.classList.remove('visible');
            }
            
            if (visible) chatWindow.scrollTop = chatWindow.scrollHeight;
        }
        
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 200) + 'px';
        }
        
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // ==================== INICIALIZACIÓN ====================
        document.addEventListener('DOMContentLoaded', () => {
            const textarea = document.getElementById('messageInput');
            
            textarea.addEventListener('input', () => autoResize(textarea));
            
            loadKnowledgeBase();
            
            setTimeout(() => {
                textarea.focus();
            }, 500);
            
            console.log('%c✅ Mockup Mesa de Ayuda IA - RAG + OpenAI integrado', 'color:#3b82f6; font-weight:bold');
        });
    </script>
