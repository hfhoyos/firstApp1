<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Ayuda IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root { --surface: rgba(255,255,255,0.92); --surface2: rgba(255,255,255,0.75); }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass { background: var(--surface); backdrop-filter: blur(24px); }
        .message-bubble { max-width: 80%; padding: 16px 20px; border-radius: 22px; }
        .user-bubble { background: #3b82f6; color: white; }
        .ai-bubble { background: var(--surface2); color: #1f2937; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-gray-100 to-gray-200">

<header class="glass border-b py-5 px-6 flex justify-between sticky top-0 z-50">
    <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-3xl flex items-center justify-center text-3xl">🤖</div>
        <div>
            <h1 class="text-2xl font-semibold">Mesa de Ayuda IA</h1>
            <p class="text-xs text-slate-500">RAG Activo</p>
        </div>
    </div>
    
    <div class="flex items-center gap-3 bg-white rounded-3xl px-5 py-2 border">
        <input type="password" id="apiKeyInput" placeholder="sk-••••••••••••••••" 
               class="bg-transparent border border-slate-300 rounded-2xl px-4 py-2 w-80 font-mono text-sm">
        <button id="connectBtn" onclick="connectAPI()" 
                class="bg-emerald-600 text-white px-6 py-2.5 rounded-2xl flex items-center gap-2">
            <i class="fa-solid fa-plug"></i> Conectar
        </button>
    </div>
</header>

<main class="flex-1 p-6 max-w-5xl mx-auto w-full">
    <div id="chatWindow" class="glass rounded-3xl p-8 h-full overflow-y-auto flex flex-col gap-6"></div>
</main>

<footer class="glass p-6">
    <div class="max-w-5xl mx-auto">
        <div class="flex gap-4 bg-white rounded-3xl p-4 border">
            <textarea id="messageInput" rows="1" placeholder="Escribe tu consulta..." 
                      class="flex-1 bg-transparent focus:outline-none px-6 py-4"></textarea>
            <button onclick="sendMessage()" class="w-14 h-14 bg-blue-600 rounded-3xl text-white">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</footer>

<script>
    let apiKey = '';
    let conversationHistory = [];
    let SYSTEM_PROMPT = "";

    // ==================== CATÁLOGO (fallback + intento de fetch) ====================
    async function loadKnowledgeBase() {
        const fallback = `BASE DE CONOCIMIENTO DEMO:
- Error 403 en facturación: Permisos insuficientes. Revisar rol de usuario.
- Recuperar contraseña: Usar opción "Olvidé mi contraseña" en la pantalla de login.
- Horario de soporte: Lunes a Viernes 8am-6pm.`;

        try {
            const res = await fetch('catalogo1.txt');
            if (res.ok) {
                const text = await res.text();
                console.log("✅ catalogo1.txt cargado desde GitHub Pages");
                SYSTEM_PROMPT = buildSystemPrompt(text);
                addMessage('assistant', '✅ Base de conocimiento cargada correctamente.');
                return;
            }
        } catch (e) {
            console.log("⚠️ No se encontró catalogo1.txt, usando fallback");
        }
        
        SYSTEM_PROMPT = buildSystemPrompt(fallback);
        addMessage('assistant', '⚠️ Usando catálogo de demostración. Sube tu archivo catalogo1.txt a la raíz del repositorio.');
    }

    function buildSystemPrompt(kb) {
        return `Eres el asistente de Mesa de Ayuda IA.
REGLAS CRÍTICAS:
1. Responde ÚNICAMENTE con la información del catálogo.
2. Si no encuentras la información, responde: "Esa información no está disponible en el catálogo. Te recomiendo contactar con soporte humano."
3. Sé profesional y conciso.

BASE DE CONOCIMIENTO:
${kb}`;
    }

    function connectAPI() {
        const key = document.getElementById('apiKeyInput').value.trim();
        if (!key.startsWith('sk-')) return alert("API Key inválida");
        apiKey = key;
        document.getElementById('connectBtn').innerHTML = '✓ Conectado';
        document.getElementById('connectBtn').style.backgroundColor = '#10b981';
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !apiKey) return;

        addMessage('user', text);
        conversationHistory.push({ role: 'user', content: text });
        input.value = '';

        const typing = addTypingIndicator();

        try {
            const res = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'gpt-4o-mini',
                    temperature: 0.3,
                    max_tokens: 700,
                    messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...conversationHistory]
                })
            });

            const data = await res.json();
            const reply = data.choices[0].message.content;
            
            removeTypingIndicator(typing);
            conversationHistory.push({ role: 'assistant', content: reply });
            addMessage('assistant', reply);
        } catch (err) {
            removeTypingIndicator(typing);
            addMessage('assistant', '❌ Error al conectar con OpenAI. Verifica tu API Key.');
        }
    }

    function addMessage(role, content) {
        const chat = document.getElementById('chatWindow');
        const isUser = role === 'user';
        const div = document.createElement('div');
        div.className = isUser ? 'flex justify-end' : 'flex gap-4';
        div.innerHTML = `
            ${!isUser ? `<div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex-shrink-0 flex items-center justify-center text-xl">🤖</div>` : ''}
            <div class="${isUser ? 'max-w-[75%]' : 'flex-1'}">
                <div class="text-xs text-slate-500 mb-1 ${isUser?'text-right':''}">${isUser?'Tú':'Asistente IA'} • Ahora</div>
                <div class="${isUser ? 'user-bubble' : 'ai-bubble'} message-bubble">${content.replace(/\n/g, '<br>')}</div>
            </div>
        `;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function addTypingIndicator() {
        const chat = document.getElementById('chatWindow');
        const div = document.createElement('div');
        div.id = 'typingIndicator';
        div.className = 'flex gap-4';
        div.innerHTML = `
            <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center text-xl">🤖</div>
            <div class="ai-bubble message-bubble">Escribiendo<span class="animate-pulse">...</span></div>
        `;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function removeTypingIndicator(el) {
        if (el) el.remove();
    }

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
        loadKnowledgeBase();
        
        const ta = document.getElementById('messageInput');
        ta.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    });
</script>
</body>
</html>
